name: VolleyStats Android APK

on:
  push:
    paths:
      - 'volleystats/**'
      - '.github/workflows/volleystats-android.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: volleystats
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: volleystats/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Build APK
        working-directory: volleystats/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VolleyStats-android-apk
          path: volleystats/android/app/build/outputs/apk/debug/app-debug.apk
